# This is the only runtime configuration file loaded by myDemo.
# Relative MP4 and model paths are resolved from this file's directory.

[global]
stream_count=4
infer_interval=2

[inference]
person_model_path=../model/person_relu.rknn
helmet_model_path=../model/helmet_relu.rknn
callplay_model_path=../model/callplay_relu.rknn
person_core=0
helmet_core=1
callplay_core=2
person_class_count=1
helmet_class_count=2
callplay_class_count=2
confidence_threshold=0.25
nms_threshold=0.45
fusion_iou_threshold=0.5
fusion_iom_threshold=0.3
fusion_confidence_threshold=0.3

# type=mp4: url is a local video path. H.264/H.265 are supported by MPP.
# type=rtsp: url is an RTSP address. H.264/H.265 are supported by MPP.
# type=camera: use device_index or device_path; url is ignored.
[stream.0]
enabled=true
type=mp4
url=../1.mp4
loop=true
reconnect_interval_ms=1000

[stream.1]
enabled=true
type=mp4
url=../2.mp4
loop=true
reconnect_interval_ms=1000

[stream.2]
enabled=true
type=mp4
url=../3.mp4
loop=true
reconnect_interval_ms=1000

[stream.3]
enabled=true
type=mp4
url=../4.mp4
loop=true
reconnect_interval_ms=1000

# Camera example:
# [stream.0]
# enabled=true
# type=camera
# device_index=0
# device_path=/dev/video0
# width=1280
# height=720
# fps=30
# reconnect_interval_ms=1000

# RTSP example:
# [stream.1]
# enabled=true
# type=rtsp
# url=rtsp://user:password@192.168.1.100:554/stream
# reconnect_interval_ms=10000

[streaming]
rtmp_url=rtmp://192.168.0.198/live/livestream
rtsp_url=rtsp://127.0.0.1/live/livestream
width=1280
height=720
fps=24
bitrate=2000000
enable_rtmp=true
enable_rtsp=false
draw_detections=true
