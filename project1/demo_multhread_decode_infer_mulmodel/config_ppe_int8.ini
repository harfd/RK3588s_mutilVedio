# 11 类 Construction-PPE INT8 板端验证配置。
# 所有相对路径均以本配置文件所在目录为基准。

[global]
stream_count=1
infer_interval=1

[inference]
mode=ppe_single
model_path=../model/best-int8.rknn
label_path=../model/construction_ppe_labels_list.txt
anchor_path=../model/RK_anchors.txt
core=0
class_count=11
confidence_threshold=0.25
nms_threshold=0.45

[stream.0]
enabled=true
type=mp4
url=../1.mp4
loop=true
reconnect_interval_ms=1000

[streaming]
# 默认仅在终端输出检测结果，不依赖推流服务器。
# 需要看带框画面时，把 enable_rtmp 改为 true 并修改 rtmp_url。
rtmp_url=rtmp://192.168.2.3/live/ppe-int8
rtsp_url=rtsp://127.0.0.1/live/ppe-int8
width=1280
height=1088
fps=24
bitrate=5000000
enable_rtmp=false
enable_rtsp=false
draw_detections=true
