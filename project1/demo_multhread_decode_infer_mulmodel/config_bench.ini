# 基准测试配置: 5 路本地 mp4, 确定性可复现输入。
# 相机路(非确定性)在对比测试中不使用; 相机路径可另行定性评估。
# 工况(capped/uncapped)与 null sink 由 run_bench.sh 通过环境变量控制:
#   BENCH_UNCAPPED=1 关闭限速   BENCH_NULL_SINK=1 编码不发网络
# 编码分辨率固定 1280x1088, [streaming] width/height 必须与之一致。

[global]
stream_count=5
infer_interval=2

[inference]
person_model_path=../model/person_relu.rknn
helmet_model_path=../model/helmet_relu.rknn
callplay_model_path=../model/callplay_relu.rknn
person_core=0
helmet_core=1
callplay_core=2
person_class_count=1
helmet_class_count=2
callplay_class_count=2
confidence_threshold=0.25
nms_threshold=0.45
fusion_iou_threshold=0.5
fusion_iom_threshold=0.3
fusion_confidence_threshold=0.3

[stream.0]
enabled=true
type=mp4
url=../1.mp4
loop=true
reconnect_interval_ms=1000

[stream.1]
enabled=true
type=mp4
url=../2.mp4
loop=true
reconnect_interval_ms=1000

[stream.2]
enabled=true
type=mp4
url=../3.mp4
loop=true
reconnect_interval_ms=1000

[stream.3]
enabled=true
type=mp4
url=../4.mp4
loop=true
reconnect_interval_ms=1000

# 第 5 路复用 1.mp4, 保持 5 路负载且无需额外素材。
[stream.4]
enabled=true
type=mp4
url=../1.mp4
loop=true
reconnect_interval_ms=1000

[streaming]
# null sink 模式下 rtmp_url 不实际使用, 但需存在。
rtmp_url=rtmp://127.0.0.1/live/bench
rtsp_url=rtsp://127.0.0.1/live/bench
width=1280
height=1088
fps=24
bitrate=5000000
enable_rtmp=true
enable_rtsp=false
draw_detections=true
