# 11 类 Construction-PPE 非量化模型的四类筛选验证配置。
# 除模型文件和推流名称外，应与 INT8 配置保持一致，便于对比。

[global]
stream_count=5
infer_interval=1

[inference]
mode=ppe_single
model_path=../model/best-fp.rknn
label_path=../model/construction_ppe_labels_list.txt
anchor_path=../model/RK_anchors.txt
core=0
# RKNN 模型本身仍为 11 类，只输出 helmet/gloves/vest/Person。
class_count=11
class_ids=0,1,2,6
confidence_threshold=0.25
nms_threshold=0.45

[stream.0]
enabled=true
type=mp4
url=../1.mp4
loop=true
reconnect_interval_ms=1000

[stream.1]
enabled=true
type=mp4
url=../2.mp4
loop=true
reconnect_interval_ms=1000

[stream.2]
enabled=true
type=mp4
url=../3.mp4
loop=true
reconnect_interval_ms=1000

[stream.3]
enabled=true
type=mp4
url=../4.mp4
loop=true
reconnect_interval_ms=1000

[stream.4]
enabled=true
type=camera
device_path=/dev/v4l/by-path/platform-rkisp1-vir0-video-index0
width=4224
height=3136
fps=8
chroma_order=uv
auto_white_balance=true
reconnect_interval_ms=1000

[streaming]
# 与 INT8 使用同一地址，便于使用相同的 ffplay 命令依次对比。
rtmp_url=rtmp://192.168.2.3/live/livestream
rtsp_url=rtsp://127.0.0.1/live/livestream
width=1280
height=1088
fps=24
bitrate=5000000
enable_rtmp=true
enable_rtsp=false
draw_detections=true
