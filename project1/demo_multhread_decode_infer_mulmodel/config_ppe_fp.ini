# 11 类 Construction-PPE 非量化模型板端验证配置。
# 除模型文件和推流名称外，应与 INT8 配置保持一致，便于对比。

[global]
stream_count=1
infer_interval=1

[inference]
mode=ppe_single
model_path=../model/best-fp.rknn
label_path=../model/construction_ppe_labels_list.txt
anchor_path=../model/RK_anchors.txt
core=0
class_count=11
confidence_threshold=0.25
nms_threshold=0.45

[stream.0]
enabled=true
type=mp4
url=../1.mp4
loop=true
reconnect_interval_ms=1000

[streaming]
rtmp_url=rtmp://192.168.2.3/live/ppe-fp
rtsp_url=rtsp://127.0.0.1/live/ppe-fp
width=1280
height=1088
fps=24
bitrate=5000000
enable_rtmp=false
enable_rtsp=false
draw_detections=true
